[project]
name = "projeto-wikipedia"
version = "0.1.0"
description = "Aula 6 do Projeto 1 do curso G learn: o mesmo dado pela API."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.14.2",
    "requests==2.32.5",
    "python-dotenv==1.2.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["testes"]
