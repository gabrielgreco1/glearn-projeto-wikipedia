[project]
name = "projeto-wikipedia"
version = "0.1.0"
description = "Aula 4 do Projeto 1 do curso G learn: achar a tabela e ler uma linha."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.14.2",
    "requests==2.32.5",
    "python-dotenv==1.2.1",
]

[dependency-groups]
dev = ["ruff==0.14.4"]

[tool.ruff]
line-length = 100
