[project]
name = "glearn-projeto-wikipedia"
version = "0.1.0"
description = "Projeto 1 do curso G learn: extrair dados da Wikipedia."
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.5",
    "beautifulsoup4==4.14.2",
    "python-dotenv==1.2.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["testes"]

[tool.ruff]
line-length = 100
